[project]
name = "cloak-local"
version = "0.1.0"
description = "Local-first adversarial document anonymization controller"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.138,<0.139",
  "httpx>=0.28,<0.29",
  "lingua-language-detector>=2.1,<3",
  "openai>=2.30,<3",
  "presidio-analyzer>=2.2.363,<3",
  "pydantic>=2.12,<3",
  "rapidfuzz>=3.14,<4",
  "uvicorn[standard]>=0.41,<0.42",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cloak"]
